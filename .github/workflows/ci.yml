name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS only: the app links AppKit, Metal and Carbon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
